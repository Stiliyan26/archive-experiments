version: '2'

services:

  nepal_postgres:
    build: ./postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PGang.12
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      net_nepal_db:
        aliases:
          - santa_crm_db

  nepal_backend:
    build: ./backend
    restart: always
    ports:
      - 42443:8443
    depends_on:
      - nepal_postgres
    networks:
      net_nepal_db:
        aliases:
          - santa_crm_backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"

networks:
  net_nepal_db:
